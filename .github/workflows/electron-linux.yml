name: Warplyn Linux release

on:
    pull_request:
    workflow_call:
        inputs:
            tag:
                description: Existing release tag
                required: true
                type: string

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    verify-linux:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-22.04
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - name: Load the Linux credential module
              run: node -e "require('@napi-rs/keyring')"
            - run: npm test --workspace @skladno/electron
            - run: npm run make:electron:linux
            - name: Install Debian package
              run: |
                  printf 'https://mirrors.edge.kernel.org/ubuntu/\n' | sudo tee /etc/apt/apt-mirrors.txt
                  printf 'https://mirrors.edge.kernel.org/ubuntu/\n' | sudo tee /etc/apt/apt-mirrors-security.txt
                  sudo apt-get update
                  sudo apt-get install -y desktop-file-utils ./packages/electron/out/make/deb/x64/*.deb
            - name: Check installed integration
              run: |
                  set -x
                  stat -c '%A %U:%G %n' /usr/lib/warplyn /usr/lib/warplyn/Warplyn
                  find /usr/lib/warplyn -perm /022 -printf '%M %u:%g %p\n'
                  test -x /usr/lib/warplyn/Warplyn
                  test "$(stat -c '%U:%G' /usr/lib/warplyn/Warplyn)" = root:root
                  test -z "$(find /usr/lib/warplyn -perm /022 -print -quit)"
                  desktop-file-validate /usr/share/applications/warplyn.desktop
                  test -s /usr/share/icons/hicolor/scalable/apps/warplyn.svg
                  ldd /usr/lib/warplyn/Warplyn | tee installed-dependencies.txt
                  ! grep -q 'not found' installed-dependencies.txt
            - name: Record package evidence
              if: always()
              run: |
                  mkdir -p linux-acceptance
                  git rev-parse HEAD > linux-acceptance/source.txt
                  cat /etc/os-release > linux-acceptance/os.txt
                  uname -m > linux-acceptance/architecture.txt
                  date -u --iso-8601=seconds > linux-acceptance/date.txt
                  sha256sum packages/electron/out/make/deb/x64/*.deb > linux-acceptance/checksums.txt
                  if compgen -G 'packages/electron/out/make/appimage/x64/*.AppImage' > /dev/null; then
                    sha256sum packages/electron/out/make/appimage/x64/*.AppImage >> linux-acceptance/checksums.txt
                  fi
                  if test -f packages/electron/out/make/appimage/x64/warplyn-appimage-x64.json; then
                    cp packages/electron/out/make/appimage/x64/warplyn-appimage-x64.json linux-acceptance/
                  fi
                  dpkg-query -s warplyn > linux-acceptance/package.txt
                  if test -f installed-dependencies.txt; then cp installed-dependencies.txt linux-acceptance/; fi
                  cp docs/development/guides/linux-installed-acceptance.md linux-acceptance/manual-checklist.md
            - name: Verify desktop journeys
              env:
                  WARPLYN_ELECTRON_EXECUTABLE: /usr/lib/warplyn/Warplyn
              run: xvfb-run --auto-servernum npm run verify:desktop
            - name: Validate AppImage and update metadata
              run: node scripts/validate-appimage.mjs
            - name: Verify AppImage desktop journeys
              run: |
                  image="$(realpath packages/electron/out/make/appimage/x64/*.AppImage)"
                  WARPLYN_ELECTRON_EXECUTABLE="$image" xvfb-run --auto-servernum npm run verify:desktop
            - name: Save desktop test failure evidence
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: linux-desktop-test-results
                  path: |
                      test-results/desktop
                      linux-acceptance
                  if-no-files-found: ignore
                  retention-days: 7
            - name: Validate Debian package
              run: |
                  shopt -s nullglob
                  assets=(packages/electron/out/make/deb/x64/*.deb)
                  test "${#assets[@]}" -eq 1
                  version="$(node -p "require('./package.json').version")"
                  dpkg-deb --info "${assets[0]}"
                  dpkg-deb --info "${assets[0]}" | grep -q '^ Package: warplyn$'
                  dpkg-deb --info "${assets[0]}" | grep -q "^ Version: ${version}$"
                  dpkg-deb --info "${assets[0]}" | grep -q '^ Architecture: amd64$'
                  dpkg-deb --info "${assets[0]}" | grep -q '^ Maintainer: Kirill Taran$'
                  dpkg-deb --info "${assets[0]}" | grep -q '^ Homepage: https://github.com/punk-link/warplyn$'
                  dpkg-deb --contents "${assets[0]}" | tee contents.txt
                  grep -q '@napi-rs/keyring-linux-x64-gnu' contents.txt
                  ! grep -q '@napi-rs/keyring-win32-x64-msvc' contents.txt
                  desktop="$(dpkg-deb --fsys-tarfile "${assets[0]}" | tar -xO --wildcards '*/applications/*.desktop')"
                  grep -qx 'Categories=Office;' <<< "$desktop"
                  grep -Eq '^Exec=.+$' <<< "$desktop"
                  grep -Eq '^Icon=.+$' <<< "$desktop"

    release-linux:
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        runs-on: ubuntu-22.04
        environment: Production
        timeout-minutes: 25
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.tag || github.ref }}
                  fetch-depth: 0
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - name: Verify release version
              env:
                  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
              run: |
                  node -e "if(require('./packages/electron/package.json').productName !== 'Warplyn') throw new Error('Inherited legacy tags cannot publish Warplyn releases')"
                  node scripts/check-electron-release-tag.mjs "$RELEASE_TAG"
            - name: Require release tag on main
              env:
                  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
              run: |
                  git fetch origin main --no-tags
                  if ! git merge-base --is-ancestor "$RELEASE_TAG^{commit}" origin/main; then
                    echo '::error::Release tags must point to a commit already contained in main.'
                    exit 1
                  fi
            - name: Package telemetry configuration
              env:
                  WARPLYN_POSTHOG_PROJECT_KEY: ${{ vars.WARPLYN_POSTHOG_PROJECT_KEY }}
              run: |
                  test -n "$WARPLYN_POSTHOG_PROJECT_KEY"
                  printf '%s' "{\"endpoint\":\"https://us.i.posthog.com/batch\",\"projectKey\":\"$WARPLYN_POSTHOG_PROJECT_KEY\"}" > packages/electron/telemetry.json
            - run: npm run make:electron:linux
            - name: Validate AppImage and update metadata
              run: node scripts/validate-appimage.mjs
            - name: Validate Debian package
              run: |
                  shopt -s nullglob
                  assets=(packages/electron/out/make/deb/x64/*.deb)
                  test "${#assets[@]}" -eq 1
                  version="$(node -p "require('./package.json').version")"
                  dpkg-deb --info "${assets[0]}"
                  dpkg-deb --info "${assets[0]}" | grep -q '^ Package: warplyn$'
                  dpkg-deb --info "${assets[0]}" | grep -q "^ Version: ${version}$"
                  dpkg-deb --info "${assets[0]}" | grep -q '^ Architecture: amd64$'
                  dpkg-deb --info "${assets[0]}" | grep -q '^ Maintainer: Kirill Taran$'
                  dpkg-deb --info "${assets[0]}" | grep -q '^ Homepage: https://github.com/punk-link/warplyn$'
                  dpkg-deb --contents "${assets[0]}" | tee contents.txt
                  grep -q '@napi-rs/keyring-linux-x64-gnu' contents.txt
                  ! grep -q '@napi-rs/keyring-win32-x64-msvc' contents.txt
                  desktop="$(dpkg-deb --fsys-tarfile "${assets[0]}" | tar -xO --wildcards '*/applications/*.desktop')"
                  grep -qx 'Categories=Office;' <<< "$desktop"
                  grep -Eq '^Exec=.+$' <<< "$desktop"
                  grep -Eq '^Icon=.+$' <<< "$desktop"
            - name: Upload Linux packages and update metadata
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
              run: |
                  shopt -s nullglob
                  assets=(packages/electron/out/make/deb/x64/*.deb)
                  test "${#assets[@]}" -eq 1
                  node scripts/publish-release-notes.mjs "$RELEASE_TAG"
                  gh release upload "$RELEASE_TAG" "${assets[0]}" packages/electron/out/make/appimage/x64/*.AppImage packages/electron/out/make/appimage/x64/warplyn-appimage-x64.json --clobber
