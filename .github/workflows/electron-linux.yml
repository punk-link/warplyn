name: Warplyn Linux release

on:
    pull_request:
    workflow_dispatch:
        inputs:
            tag:
                description: Existing release tag
                required: true
    push:
        tags:
            - "v*"

permissions:
    contents: read

jobs:
    verify-linux:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - name: Load the Linux credential module
              run: node -e "require('@napi-rs/keyring')"
            - run: npm test --workspace @skladno/electron
            - run: npm run make:electron:linux
            - name: Install Debian package
              run: sudo apt-get install -y ./packages/electron/out/make/deb/x64/*.deb
            - name: Smoke test packaged Assistant
              env:
                  WARPLYN_ELECTRON_EXECUTABLE: /usr/lib/warplyn/Warplyn
              run: xvfb-run --auto-servernum npx playwright test --config playwright.electron.config.ts
            - name: Validate Debian package
              run: |
                  shopt -s nullglob
                  assets=(packages/electron/out/make/deb/x64/*.deb)
                  test "${#assets[@]}" -eq 1
                  version="$(node -p "require('./package.json').version")"
                  dpkg-deb --info "${assets[0]}"
                  dpkg-deb --info "${assets[0]}" | grep -q '^ Package: warplyn$'
                  dpkg-deb --info "${assets[0]}" | grep -q "^ Version: ${version}$"
                  dpkg-deb --info "${assets[0]}" | grep -q '^ Architecture: amd64$'
                  dpkg-deb --info "${assets[0]}" | grep -q '^ Maintainer: Kirill Taran$'
                  dpkg-deb --info "${assets[0]}" | grep -q '^ Homepage: https://github.com/punk-link/warplyn$'
                  dpkg-deb --contents "${assets[0]}" | tee contents.txt
                  grep -q '@napi-rs/keyring-linux-x64-gnu' contents.txt
                  ! grep -q '@napi-rs/keyring-win32-x64-msvc' contents.txt
                  desktop="$(dpkg-deb --fsys-tarfile "${assets[0]}" | tar -xO --wildcards '*/applications/*.desktop')"
                  grep -qx 'Categories=Office;' <<< "$desktop"
                  grep -Eq '^Exec=.+$' <<< "$desktop"
                  grep -Eq '^Icon=.+$' <<< "$desktop"

    release-linux:
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        environment: Production
        timeout-minutes: 25
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.tag || github.ref }}
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - name: Verify release version
              env:
                  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
              run: |
                  node -e "if(require('./packages/electron/package.json').productName !== 'Warplyn') throw new Error('Inherited legacy tags cannot publish Warplyn releases')"
                  node scripts/check-electron-release-tag.mjs "$RELEASE_TAG"
            - name: Package telemetry configuration
              env:
                  WARPLYN_POSTHOG_PROJECT_KEY: ${{ vars.WARPLYN_POSTHOG_PROJECT_KEY }}
              run: |
                  test -n "$WARPLYN_POSTHOG_PROJECT_KEY"
                  printf '%s' "{\"endpoint\":\"https://us.i.posthog.com/batch\",\"projectKey\":\"$WARPLYN_POSTHOG_PROJECT_KEY\"}" > packages/electron/telemetry.json
            - run: npm run make:electron:linux
            - name: Validate Debian package
              run: |
                  shopt -s nullglob
                  assets=(packages/electron/out/make/deb/x64/*.deb)
                  test "${#assets[@]}" -eq 1
                  version="$(node -p "require('./package.json').version")"
                  dpkg-deb --info "${assets[0]}"
                  dpkg-deb --info "${assets[0]}" | grep -q '^ Package: warplyn$'
                  dpkg-deb --info "${assets[0]}" | grep -q "^ Version: ${version}$"
                  dpkg-deb --info "${assets[0]}" | grep -q '^ Architecture: amd64$'
                  dpkg-deb --info "${assets[0]}" | grep -q '^ Maintainer: Kirill Taran$'
                  dpkg-deb --info "${assets[0]}" | grep -q '^ Homepage: https://github.com/punk-link/warplyn$'
                  dpkg-deb --contents "${assets[0]}" | tee contents.txt
                  grep -q '@napi-rs/keyring-linux-x64-gnu' contents.txt
                  ! grep -q '@napi-rs/keyring-win32-x64-msvc' contents.txt
                  desktop="$(dpkg-deb --fsys-tarfile "${assets[0]}" | tar -xO --wildcards '*/applications/*.desktop')"
                  grep -qx 'Categories=Office;' <<< "$desktop"
                  grep -Eq '^Exec=.+$' <<< "$desktop"
                  grep -Eq '^Icon=.+$' <<< "$desktop"
            - name: Upload Debian package
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
              run: |
                  shopt -s nullglob
                  assets=(packages/electron/out/make/deb/x64/*.deb)
                  test "${#assets[@]}" -eq 1
                  if [[ "$RELEASE_TAG" == *-preview.* ]]; then prerelease=--prerelease; else prerelease=; fi
                  if ! gh release create "$RELEASE_TAG" $prerelease --title "Warplyn $RELEASE_TAG" --notes "Unsigned Warplyn preview release."; then
                    gh release view "$RELEASE_TAG" >/dev/null
                  fi
                  gh release upload "$RELEASE_TAG" "${assets[0]}" --clobber
