name: Warplyn Windows release

on:
    pull_request:
    workflow_dispatch:
        inputs:
            tag:
                description: Existing release tag
                required: true
    push:
        tags:
            - "v*"

permissions:
    contents: read

jobs:
    verify-windows:
        if: github.event_name == 'pull_request'
        runs-on: windows-latest
        timeout-minutes: 20

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Test Electron
              run: npm test --workspace @skladno/electron

            - name: Build packaged application
              run: npm run package:electron

            - name: Smoke test packaged Assistant
              run: npx playwright test --config playwright.electron.config.ts

            - name: Save desktop test failure evidence
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: windows-desktop-test-results
                  path: test-results
                  if-no-files-found: ignore

    release-windows:
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        runs-on: windows-latest
        environment: Production
        timeout-minutes: 25
        permissions:
            contents: write

        steps:
            - name: Check out repository
              uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.tag || github.ref }}

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Verify release version
              env:
                  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
              run: |
                  node -e "if(require('./packages/electron/package.json').productName !== 'Warplyn') throw new Error('Inherited legacy tags cannot publish Warplyn releases')"
                  if ($LASTEXITCODE -ne 0) { throw 'Legacy release blocked.' }
                  node scripts/check-electron-release-tag.mjs $env:RELEASE_TAG

            - name: Package telemetry configuration
              env:
                  WARPLYN_POSTHOG_PROJECT_KEY: ${{ vars.WARPLYN_POSTHOG_PROJECT_KEY }}
              run: |
                  if ([string]::IsNullOrWhiteSpace($env:WARPLYN_POSTHOG_PROJECT_KEY)) { throw 'The WARPLYN_POSTHOG_PROJECT_KEY repository variable is required to create a telemetry-enabled release.' }
                  @{ endpoint = 'https://us.i.posthog.com/batch'; projectKey = $env:WARPLYN_POSTHOG_PROJECT_KEY } | ConvertTo-Json -Compress | Set-Content -NoNewline packages/electron/telemetry.json

            - name: Build installer
              run: npm run make:electron

            - name: Generate and validate WinGet manifests
              if: ${{ !contains(inputs.tag || github.ref_name, '-preview.') }}
              run: |
                  $setup = @(Get-ChildItem packages/electron/out/make -Recurse -File -Filter '*setup.exe')
                  if ($setup.Count -ne 1) { throw 'Expected exactly one setup executable.' }
                  node scripts/generate-winget-manifests.mjs $setup[0].FullName "$env:RUNNER_TEMP/winget"
                  if ($LASTEXITCODE -ne 0) { throw 'WinGet manifest generation failed.' }
                  $version = (Get-Content packages/electron/package.json | ConvertFrom-Json).version
                  if (-not (Get-Command winget -ErrorAction SilentlyContinue)) {
                    Install-Module Microsoft.WinGet.Client -Repository PSGallery -Scope CurrentUser -Force -ErrorAction Stop
                    Repair-WinGetPackageManager -AllUsers -Force -Latest -ErrorAction Stop
                    $env:PATH += ";$env:LOCALAPPDATA/Microsoft/WindowsApps"
                  }
                  winget validate --manifest "$env:RUNNER_TEMP/winget/$version" --disable-interactivity
                  if ($LASTEXITCODE -ne 0) { throw 'WinGet manifest validation failed.' }

            - name: Save WinGet submission manifests
              if: ${{ !contains(inputs.tag || github.ref_name, '-preview.') }}
              uses: actions/upload-artifact@v4
              with:
                  name: winget-${{ inputs.tag || github.ref_name }}
                  path: ${{ runner.temp }}/winget
                  if-no-files-found: error

            - name: Upload unsigned Windows assets
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
              run: |
                  $assets = Get-ChildItem packages/electron/out/make -Recurse -File | Where-Object { $_.Name -match 'setup\.exe$|^RELEASES$|-full\.nupkg$' }
                  $setup = $assets | Where-Object Name -match 'setup\.exe$'
                  $releases = $assets | Where-Object Name -eq 'RELEASES'
                  $package = $assets | Where-Object Name -match '-full\.nupkg$'
                  if ($setup.Count -ne 1 -or $releases.Count -ne 1 -or $package.Count -ne 1) { throw 'Expected exactly one setup executable, RELEASES manifest, and full nupkg.' }
                  if ($setup.Name -notmatch '^Warplyn-' -or $package.Name -notmatch '^com\.warplyn\.desktop-') { throw 'Legacy assets cannot publish in the Warplyn feed.' }
                  gh release create $env:RELEASE_TAG --prerelease=$($env:RELEASE_TAG -match '-preview\.') --title "Warplyn $env:RELEASE_TAG" --notes "Unsigned Warplyn preview release."
                  if ($LASTEXITCODE -ne 0) {
                    gh release view $env:RELEASE_TAG
                    if ($LASTEXITCODE -ne 0) { throw 'Could not create or find the release.' }
                  }
                  gh release upload $env:RELEASE_TAG $setup.FullName $releases.FullName $package.FullName --clobber
