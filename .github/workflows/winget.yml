name: WinGet installation lifecycle

on:
    workflow_dispatch:
    pull_request:
        paths:
            - .github/workflows/winget.yml
            - scripts/verify-winget-installation.ps1
            - scripts/generate-winget-manifests.mjs
            - distribution/winget/**

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    lifecycle:
        runs-on: windows-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
            - name: Install current stable WinGet
              shell: pwsh
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  $tag = gh release view --repo microsoft/winget-cli --json tagName --jq .tagName
                  if ($LASTEXITCODE -ne 0 -or $tag -notmatch '^v\d+\.\d+\.\d+$') { throw 'Expected a stable WinGet release.' }
                  $directory = Join-Path $env:RUNNER_TEMP 'winget-client'
                  New-Item -ItemType Directory -Path $directory | Out-Null
                  gh release download $tag --repo microsoft/winget-cli --dir $directory --pattern Microsoft.DesktopAppInstaller_8wekyb3d8bbwe.msixbundle --pattern DesktopAppInstaller_Dependencies.zip
                  if ($LASTEXITCODE -ne 0) { throw 'Could not download the official WinGet release.' }
                  Expand-Archive -LiteralPath (Join-Path $directory 'DesktopAppInstaller_Dependencies.zip') -DestinationPath (Join-Path $directory 'dependencies')
                  $dependencies = @(Get-ChildItem (Join-Path $directory 'dependencies/x64') -File -Filter '*.appx' | ForEach-Object FullName)
                  if ($dependencies.Count -eq 0) { throw 'Missing x64 WinGet dependencies.' }
                  Add-AppxPackage -Path (Join-Path $directory 'Microsoft.DesktopAppInstaller_8wekyb3d8bbwe.msixbundle') -DependencyPath $dependencies -ForceApplicationShutdown -ErrorAction Stop
                  $env:PATH += ";$env:LOCALAPPDATA/Microsoft/WindowsApps"
                  Add-Content -LiteralPath $env:GITHUB_PATH -Value "$env:LOCALAPPDATA/Microsoft/WindowsApps"
                  $installed = winget --version
                  Write-Output "WinGet version: $installed"
                  if ($LASTEXITCODE -ne 0 -or $installed.Trim() -ne $tag) { throw 'WinGet does not match the selected stable release.' }
            - name: Verify published installer lifecycle
              shell: pwsh
              env:
                  GH_TOKEN: ${{ github.token }}
              run: ./scripts/verify-winget-installation.ps1
            - name: Save validated manifests and results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: winget-lifecycle
                  path: ${{ runner.temp }}/warplyn-winget-lifecycle/**/*.yaml
                  if-no-files-found: ignore
            - name: Save lifecycle evidence
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: winget-lifecycle-results
                  path: |
                      ${{ runner.temp }}/warplyn-winget-lifecycle/lifecycle-results.json
                      ${{ runner.temp }}/warplyn-winget-lifecycle/*.log
                      ${{ runner.temp }}/warplyn-winget-lifecycle/runner-desktop.png
                  if-no-files-found: ignore
