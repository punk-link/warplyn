name: WinGet installation lifecycle

on:
    workflow_dispatch:
    pull_request:
        paths:
            - .github/workflows/winget.yml
            - scripts/verify-winget-installation.ps1
            - scripts/generate-winget-manifests.mjs
            - distribution/winget/**

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    lifecycle:
        runs-on: windows-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
            - name: Install current stable WinGet
              shell: pwsh
              run: |
                  Install-Module Microsoft.WinGet.Client -Repository PSGallery -Scope CurrentUser -Force -ErrorAction Stop
                  Repair-WinGetPackageManager -AllUsers -Force -Latest -ErrorAction Stop
                  $env:PATH += ";$env:LOCALAPPDATA/Microsoft/WindowsApps"
                  Add-Content -LiteralPath $env:GITHUB_PATH -Value "$env:LOCALAPPDATA/Microsoft/WindowsApps"
                  winget --version
                  if ($LASTEXITCODE -ne 0) { throw 'WinGet is unavailable after repair.' }
            - name: Verify published installer lifecycle
              shell: pwsh
              env:
                  GH_TOKEN: ${{ github.token }}
              run: ./scripts/verify-winget-installation.ps1
            - name: Save validated manifests and results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: winget-lifecycle
                  path: ${{ runner.temp }}/warplyn-winget-lifecycle/**/*.yaml
                  if-no-files-found: ignore
            - name: Save lifecycle evidence
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: winget-lifecycle-results
                  path: |
                      ${{ runner.temp }}/warplyn-winget-lifecycle/lifecycle-results.json
                      ${{ runner.temp }}/warplyn-winget-lifecycle/*.log
                  if-no-files-found: ignore
