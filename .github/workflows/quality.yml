name: Quality

on:
    pull_request:
    push:
        branches:
            - main

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    core:
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Check out repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Audit production dependencies
              run: npm audit --omit=dev --audit-level=high

            - name: Verify core
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
              run: npm run verify:core

    browser:
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Build shared contracts
              run: npm run build --workspace @skladno/shared

            - name: Install Chromium
              run: npx playwright install --with-deps chromium

            - name: Verify browser journeys
              run: npm run verify:browser

            - name: Save browser test failure evidence
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: browser-test-results
                  path: test-results/browser
                  if-no-files-found: ignore
                  retention-days: 7

    verify:
        needs: [core, browser]
        if: ${{ always() }}
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Require all quality checks to pass
              env:
                  CORE_RESULT: ${{ needs.core.result }}
                  BROWSER_RESULT: ${{ needs.browser.result }}
              run: |
                  test "$CORE_RESULT" = success
                  test "$BROWSER_RESULT" = success
